openapi: 3.2.0
info:
  title: Fama Public Public Endpoints API
  description: 'Exchanges existing "Core" Basic Auth for an "Ossa" API token for use with Public API endpoints.

    This is typically only useful for API customers migrating from the deprecated "Core" platform. It will yield an API token for use in bearer Authorization header.

    New and Migrated API users can simply retrieve their API token from their Company Page in the Ossa Application.

    For access to our sandbox environment, please request sandbox access.'
  version: dev
  contact:
    url: https://fama.readme.io
    email: admin@developer.fama.io
servers:
- url: https://api.sandbox.service.fama.io
  description: Sandbox server for testing
security:
- bearerAuth: []
tags:
- name: Public Endpoints
paths:
  /api/checkTypes:
    get:
      tags:
      - Public Endpoints
      summary: Get Check Types
      operationId: get_check_types_api_checkTypes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Get Check Types Api Checktypes Get
                type: array
                items:
                  title: CheckType
                  required:
                  - uuid
                  - name
                  - behaviors
                  - lookbackMonths
                  - displayImages
                  - review
                  - itemSources
                  type: object
                  properties:
                    uuid:
                      title: Uuid
                      type: string
                      format: uuid
                    name:
                      title: Name
                      type: string
                    behaviors:
                      title: Behaviors
                      type: array
                      items:
                        type: string
                    lookbackMonths:
                      title: Lookbackmonths
                      type: integer
                    displayImages:
                      title: Displayimages
                      type: boolean
                    review:
                      title: Review
                      type: boolean
                    itemSources:
                      title: Itemsources
                      type: array
                      items:
                        type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                title: HTTPValidationError
                type: object
                properties:
                  detail:
                    title: Detail
                    type: array
                    items:
                      title: ValidationError
                      required:
                      - loc
                      - msg
                      - type
                      type: object
                      properties:
                        loc:
                          title: Location
                          type: array
                          items:
                            anyOf:
                            - type: string
                            - type: integer
                        msg:
                          title: Message
                          type: string
                        type:
                          title: Error Type
                          type: string
