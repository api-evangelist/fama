        examples:
          sample:
            summary: Sample report UUID
            value: 123e4567-e89b-12d3-a456-426614174000
      - description: Which page to fetch. Defaults to `1`.
        required: false
        schema:
          type: integer
          title: Page
          description: Which page to fetch. Defaults to `1`.
          default: 1
        name: page
        in: query
        examples:
          firstPage:
            summary: First page
            value: 1
      - description: Number of items per page. Defaults to `50`.
        required: false
        schema:
          type: integer
          title: Size
          description: Number of items per page. Defaults to `50`.
          default: 50
        name: size
        in: query
        examples:
          defaultSize:
            summary: Default page size
            value: 50
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: XPage[Post]
                required:
                - data
                - offset
                - size
                properties:
                  data:
                    type: array
                    title: Data
                    description: The posts returned for the current page.
                    items:
                      type: object
                      title: Post
                      required:
                      - url
                      - text
                      - type
                      properties:
                        url:
                          type: string
                          title: Url
                          description: The URL associated with the post.
                        text:
                          type: string
                          title: Text
                          description: The text content of the post.
                        type:
                          type: string
                          title: Type
                          description: The post type.
                        keywords:
                          type: array
                          title: Keywords
                          description: Keywords matched in the post.
                          items:
                            type: string
                          default: []
                        behaviors:
                          type: array
                          title: Behaviors
                          description: Behaviors associated with the post.
                          items:
                            type: string
                          default: []
                  offset:
                    type: integer
                    title: Offset
                    description: The result offset for the current page.
                  size:
                    type: integer
                    title: Size
                    description: The number of post records returned in the current page.
                  next:
                    type: integer
                    title: Next
                    description: The next page value, when more post records are available.
              examples:
                posts:
                  summary: Paginated post results
                  value:
                    data:
                    - url: https://example.com/posts/1
                      text: Example post text
                      type: post
                      keywords:
                      - example keyword
                      behaviors:
