# x-archived-from: fama-external-interface-openapi.yml
# x-archived-on: 2026-10-16
openapi: 3.1.0
info:
  title: Fama External Interface
  description: Public endpoints.
  version: dev
security:
- bearerAuth: []
servers:
- url: https://public-api-sandbox.fama.io
  description: Sandbox server for testing
paths:
  /behavior_kit/{behavior_kit_uuid}:
    get:
      tags:
      - PublicAPI
      summary: Get Behavior Kit
      description: Retrieve details for a specific behavior kit by behavior kit UUID, including its name, lookback period, image display setting, configured behaviors, and keyword groups.
      operationId: _get_behavior_kit_behavior_kit__behavior_kit_uuid__get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
          title: Behavior Kit Uuid
        name: behavior_kit_uuid
        in: path
        description: The UUID of the behavior kit to retrieve.
        examples:
          sample:
            summary: Sample behavior kit UUID
            value: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: BehaviorKit
                required:
                - uuid
                - name
                - display_images
                properties:
                  uuid:
                    type: string
                    format: uuid
                    title: Uuid
                    description: The UUID of the behavior kit.
                  name:
                    type: string
                    title: Name
                    description: The behavior kit name.
                  lookback_months:
                    type: integer
                    title: Lookback Months
                    description: The number of months included in the behavior kit lookback period.
                  display_images:
                    type: boolean
                    title: Display Images
                    description: Indicates whether images are displayed for the behavior kit.
                  behaviors:
                    type: array
                    title: Behaviors
                    description: The behaviors configured for the behavior kit.
                    items:
                      type: string
                    default: []
                  keyword_groups:
                    type: array
                    title: Keyword Groups
                    description: The keyword groups configured for the behavior kit.
                    items:
                      type: object
                      title: KeywordGroup
                      required:
                      - name
                      properties:
                        name:
                          type: string
                          title: Name
                          description: The keyword group name.
                        include_exact:
                          type: array
                          title: Include Exact
                          description: Exact keywords included in the keyword group.
                          items:
                            type: string
                          default: []
                        include_fuzzy:
                          type: array
                          title: Include Fuzzy
                          description: Fuzzy-match keywords included in the keyword group.
                          items:
                            type: string
                          default: []
                        exclude_exact:
                          type: array
                          title: Exclude Exact
                          description: Exact keywords excluded from the keyword group.
                          items:
                            type: string
                          default: []
                        exclude_fuzzy:
                          type: array
                          title: Exclude Fuzzy
                          description: Fuzzy-match keywords excluded from the keyword group.
                          items:
                            type: string
                          default: []
                    default: []
              examples:
                behaviorKit:
                  summary: Behavior kit details
                  value:
                    uuid: 123e4567-e89b-12d3-a456-426614174000
                    name: Example Behavior Kit
                    lookback_months: 84
                    display_images: true
                    behaviors:
                    - adverse
                    - community
                    keyword_groups:
                    - name: Example Keyword Group
                      include_exact:
                      - example keyword
                      include_fuzzy:
                      - related keyword
                      exclude_exact:
                      - excluded keyword
                      exclude_fuzzy:
                      - excluded related keyword
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                title: HTTPValidationError
                properties:
                  detail:
                    type: array
                    title: Detail
                    items:
                      type: object
                      title: ValidationError
                      required:
                      - loc
                      - msg
                      - type
                      properties:
                        loc:
                          type: array
                          title: Location
                          items:
                            oneOf:
                            - type: string
                            - type: integer
                        msg:
                          type: string
                          title: Message
                        type:
                          type: string
                          title: Error Type
              examples:
                invalidBehaviorKitUuid:
                  summary: Invalid behavior kit UUID
                  value:
                    detail:
                    - loc:
                      - path
                      - behavior_kit_uuid
                      msg: value is not a valid uuid
                      type: type_error.uuid
      x-readme:
        code-samples:
        - language: curl
          name: Get behavior kit details
          code: "curl --request GET \\\n  --url https://public-api-sandbox.fama.io/behavior_kit/123e4567-e89b-12d3-a456-426614174000 \\\n  --header 'Authorization: Bearer YOUR_API_TOKEN'"
  /check_type/{check_type_uuid}:
    get:
      tags:
      - PublicAPI
      summary: Get Check Type
      description: Retrieve details for a specific check type by check type UUID, including its name, report type, lookback period, SLA, item types, item sources, and configured behaviors.
      operationId: _get_check_type_check_type__check_type_uuid__get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
          title: Check Type Uuid
        name: check_type_uuid
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: CheckType
                required:
                - check_type_uuid
                - name
                - lookback_months
                - sla_hours
                - report_type
                properties:
                  check_type_uuid:
                    type: string
                    format: uuid
                    title: Check Type Uuid
                  name:
                    type: string
                    title: Name
                  item_types:
                    type: array
                    title: Item Types
                    items:
                      type: string
                    default: []
                  item_sources:
                    type: array
                    title: Item Sources
                    items:
                      type: string
                    default: []
                  behaviors:
                    type: array
                    title: Behaviors
                    items:
                      type: string
                    default: []
                  lookback_months:
                    type: integer
                    title: Lookback Months
                  sla_hours:
                    type: integer
                    title: Sla Hours
                  report_type:
                    type: string
                    title: Report Type
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                title: HTTPValidationError
                properties:
                  detail:
                    type: array
                    title: Detail
                    items:
                      type: object
                      title: ValidationError
                      required:
                      - loc
                      - msg
                      - type
                      properties:
                        loc:
                          type: array
                          title: Location
                          items:
                            oneOf:
                            - type: string
                            - type: integer
                        msg:
                          type: string
                          title: Message
                        type:
                          type: string
                          title: Error Type
  /company/{company_uuid}:
    get:
      tags:
      - PublicAPI
      summary: Get Company
      description: Retrieve company details by company UUID. Use this endpoint to confirm the company name and parent company relationship before requesting checks or reviewing check status records.
      operationId: _get_company_company__company_uuid__get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
          title: Company Uuid
        name: company_uuid
        in: path
        description: The UUID of the company to retrieve.
        examples:
          sample:
            summary: Sample company UUID
            value: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: CompanyDetail
                required:
                - company_uuid
                - name
                properties:
                  company_uuid:
                    type: string
                    format: uuid
                    title: Company Uuid
                    description: The UUID of the company.
                  parent_company_uuid:
                    type: string
                    format: uuid
                    title: Parent Company Uuid
                    description: The UUID of the parent company, when the company belongs to a parent company.
                  name:
                    type: string
                    title: Name
                    description: The company name.
              examples:
                company:
                  summary: Company details
                  value:
                    company_uuid: 123e4567-e89b-12d3-a456-426614174000
                    parent_company_uuid: 987e6543-e21b-12d3-a456-426614174999
                    name: Example Company
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                type: object
                title: HTTPValidationError
                properties:
                  detail:
                    type: array
                    title: Detail
                    items:
                      type: object
                      title: ValidationError
                      required:
                      - loc
                      - msg
                      - type
                      properties:
                        loc:
                          type: array
                          title: Location
                          items:
                            oneOf:
                            - type: string
                            - type: integer
                        msg:
                          type: string
                          title: Message
                        type:
                          type: string
                          title: Error Type
              examples:
                invalidCompanyUuid:
                  summary: Invalid company UUID
                  value:
                    detail:
                    - loc:
                      - path
                      - company_uuid
                      msg: value is not a valid uuid
                      type: type_error.uuid
      x-readme:
        code-samples:
        - language: curl
          name: Get company details
          code: "curl --request GET \\\n  --url https://public-api-sandbox.fama.io/company/123e4567-e89b-12d3-a456-426614174000 \\\n  --header 'Authorization: Bearer YOUR_API_TOKEN'"
  /company/{company_uuid}/check:
    post:
      tags:
      - PublicAPI
      summary: Request Check
      operationId: _request_check_company__company_uuid__check_post
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
          title: Company Uuid
        name: company_uuid
        in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Submit a new check request, validate the required request fields, and follow the next steps to monitor status and retrieve report data.
    get:
      tags:
      - PublicAPI
      summary: Check Status
      operationId: _check_status_company__company_uuid__check_get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
          title: Company Uuid
        name: company_uuid
        in: path
      - description: Only checks created after specified date and time in UTC
        required: false
        schema:
          type: string
          format: date-time
          title: Created At Gt
          description: Only checks created after specified date and time in UTC
        name: created_at_gt
        in: query
      - description: Only checks created before specified date and time in UTC
        required: false
        schema:
          type: string
          format: date-time
          title: Created At Lt
          description: Only checks created before specified date and time in UTC
        name: created_at_lt
        in: query
      - description: Search by name
        required: false
        schema:
          type: string
          maxLength: 50
          title: Search
          description: Search by name
        name: search
        in: query
      - description: Filter by Status
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/fama_interfaces__workflow_dal__Status'
          description: Filter by Status
        name: status
        in: query
      - description: Which page to fetch, default=1
        required: false
        schema:
          type: integer
          title: Page
          description: Which page to fetch, default=1
          default: 1
        name: page
        in: query
      - description: Number of items per page, default=50
        required: false
        schema:
          type: integer
          title: Size
          description: Number of items per page, default=50
          default: 50
          max: 50
          min: 1
        name: size
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CheckStatus'
                type: array
                title: Response  Check Status Company  Company Uuid  Check Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      description: Retrieve check status records for a company, filter results by date, name, status, or pagination, and use report UUIDs to fetch report data.
