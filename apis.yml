aid: fama
name: Fama
description: >-
  Fama is an AI-powered social media and online screening platform for employment
  decisions. Its REST API lets HR platforms and background-screening providers submit
  candidate checks and retrieve behavioral findings — flagged posts, web content, and
  social profiles — mapped to workplace-misconduct categories across 30+ languages while
  filtering out protected-class information for EEOC/FCRA-aligned adjudication. Reports are
  delivered via completion callbacks or polling as JSON or a signed PDF, powering
  pre-employment screening (Fama Plus), comprehensive candidate assessment (Fama 360), and
  ongoing employee monitoring (Fama Pulse).
